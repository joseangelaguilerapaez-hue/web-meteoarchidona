<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>MeteoArchidona · Visor meteorológico regional</title>


<link
rel="stylesheet"
href="../css/fuentes.css?v=20260913-fuentes1"
>

<link
rel="stylesheet"
href="./radar.css?v=20260913-mapa1"
>


</head>

<body>

<main class="visor">


<header class="visor-cabecera">

<div class="visor-titulo">

<div class="visor-titulo-principal">
Visor meteorológico regional
</div>

<div class="visor-titulo-secundario">
Radar · Satélite · Rayos · MeteoArchidona
</div>

</div>


<div class="visor-derecha">

<div
class="estado"
id="estado"
>

<span class="estado-punto"></span>

<span id="estado-texto">
Cargando
</span>

</div>


<div class="instante">

<div
class="instante-hora"
id="instante-hora"
>
--:--
</div>

<div
class="instante-fecha"
id="instante-fecha"
>
--
</div>

</div>

</div>

</header>


<section
class="selector-fondos"
aria-label="Fondo cartográfico"
>

<div class="selector-fondos-titulo">
Fondo
</div>


<div class="selector-fondos-controles">


<button
type="button"
class="selector-fondo selector-fondo-satelite activo"
id="fondo-satelite"
data-fondo="satelite"
aria-pressed="true"
title="Mostrar ortoimagen de satélite y fotografía aérea IGN / PNOA"
>
SATÉLITE HD
</button>


<button
type="button"
class="selector-fondo selector-fondo-politico"
id="fondo-politico"
data-fondo="politico"
aria-pressed="false"
title="Mostrar mapa político"
>
POLÍTICO
</button>


<button
type="button"
class="selector-fondo selector-fondo-fisico"
id="fondo-fisico"
data-fondo="fisico"
aria-pressed="false"
title="Mostrar mapa físico"
>
FÍSICO
</button>


<button
type="button"
class="selector-fondo selector-fondo-negro"
id="fondo-negro"
data-fondo="negro"
aria-pressed="false"
title="Mostrar fondo meteorológico negro"
>
NEGRO
</button>


</div>

</section>


<section
class="selector-capas"
aria-label="Capas meteorológicas"
>

<div class="selector-capas-titulo">
Capas
</div>


<div class="selector-capas-controles">


<button
type="button"
class="selector-capa selector-capa-satelite"
id="capa-satelite"
data-capa="satelite"
aria-pressed="false"
title="Capa de satélite meteorológico pendiente de integración"
disabled
>

<span>
SATÉLITE
</span>

<span class="selector-capa-estado">
Próximamente
</span>

</button>


<button
type="button"
class="selector-capa selector-capa-radar activa"
id="capa-radar"
data-capa="radar"
aria-pressed="true"
title="Mostrar u ocultar capa radar"
>

<span>
RADAR
</span>

<span class="selector-capa-estado">
Activa
</span>

</button>


<button
type="button"
class="selector-capa selector-capa-rayos"
id="capa-rayos"
data-capa="rayos"
aria-pressed="false"
title="Capa de rayos pendiente de integración"
disabled
>

<span>
RAYOS
</span>

<span class="selector-capa-estado">
Próximamente
</span>

</button>


</div>

</section>


<section class="mapa-zona">

<div
id="mapa-radar"
aria-label="Mapa meteorológico regional MeteoArchidona"
>
</div>

<div
class="mensaje"
id="mensaje"
>
</div>

</section>


<section class="controles">


<div class="botones">


<button
type="button"
class="boton"
id="anterior"
title="Fotograma anterior"
>
◀
</button>


<button
type="button"
class="boton boton-principal"
id="reproducir"
title="Reproducir"
>
▶
</button>


<button
type="button"
class="boton"
id="siguiente"
title="Fotograma siguiente"
>
▶|
</button>


<button
type="button"
class="boton"
id="recargar"
title="Recargar timelines"
>
↻
</button>


</div>


<div class="timeline">

<input
type="range"
id="timeline-slider"
min="0"
max="0"
value="0"
step="1"
aria-label="Timeline meteorológica regional"
>


<div class="timeline-textos">

<span id="timeline-inicio">
--
</span>


<span
class="timeline-hora-actual"
id="timeline-posicion"
>
--:--
</span>


<span id="timeline-fin">
--
</span>

</div>

</div>


<div class="opacidad">

<div class="opacidad-cabecera">

<span>
Opacidad radar
</span>

<span id="opacidad-valor">
82 %
</span>

</div>


<input
type="range"
id="opacidad-slider"
min="10"
max="100"
value="82"
step="1"
aria-label="Opacidad radar"
>

</div>


</section>


<footer class="datos">


<div class="dato">

<div class="dato-label">
Fotogramas regionales
</div>

<div
class="dato-valor"
id="dato-fotogramas"
>
--
</div>

</div>


<div class="dato">

<div class="dato-label">
Radares disponibles
</div>

<div
class="dato-valor"
id="dato-radares"
>
--
</div>

</div>


<div class="dato">

<div class="dato-label">
Localidades
</div>

<div
class="dato-valor"
id="dato-localidades"
>
--
</div>

</div>


<div class="dato">

<div class="dato-label">
Capas en instante
</div>

<div
class="dato-valor"
id="dato-capas"
>
--
</div>

</div>


</footer>

</main>

<script

<script

></script>


</body>
</html>
