
<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<meta
    name="referrer"
    content="strict-origin-when-cross-origin"
>

<title>MeteoArchidona · Visor YouTube</title>

<link
    rel="stylesheet"
    href="../css/fuentes.css?v=20260913-lluvia2"
>

<link
    rel="stylesheet"
    href="youtube.css?v=20261015-youtube1"
>

<script
    src="youtube.js?v=20261015-youtube1"
    defer
></script>

</head>

<body>

<main
    class="visor-youtube"
    aria-label="Reproductor de YouTube"
>

    <div
        id="visor-youtube-pantalla"
        class="visor-youtube-pantalla"
    >

        <div
            id="visor-youtube-portada"
            class="visor-youtube-portada"
        >

            <img
                class="visor-youtube-logo"
                src="/assets/icono-camaras-192.png"
                alt=""
            >

            <strong id="visor-youtube-titulo">
                Vídeo de YouTube
            </strong>

            <p id="visor-youtube-mensaje">
                El contenido se reproduce desde YouTube
                y conserva todos los elementos originales
                de su autor.
            </p>

            <button
                id="visor-youtube-reproducir"
                class="visor-youtube-boton"
                type="button"
            >

                <span
                    class="visor-youtube-play"
                    aria-hidden="true"
                ></span>

                Reproducir

            </button>

            <a
                id="visor-youtube-enlace"
                class="visor-youtube-enlace"
                href="https://www.youtube.com/"
                target="_blank"
                rel="noopener"
                hidden
            >
                Abrir el vídeo original en YouTube
            </a>

        </div>

    </div>

</main>

</body>
</html>

<!-- Fin de fichero: visores/youtube.html -->
