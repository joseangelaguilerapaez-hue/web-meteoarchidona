
<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0,viewport-fit=cover"
>

<title>
MeteoArchidona · Visor de vídeo
</title>


<link
rel="stylesheet"
href="../css/fuentes.css?v=20260913-fuentes1"
>


<link
rel="stylesheet"
href="../css/paleta.css?v=20260913-pruebas1"
>


<!--
    Estilos del visor multimedia.

    Incluye controles temporales MP4,
    adaptación móvil y pantalla completa.
-->


<link
rel="stylesheet"
href="../css/visor-video.css?v=20261101-termometro1"
>


<script
src="../js/api.js?v=20261003-vps1"
defer
></script>


<script
src="../js/vendor/hls-1.7.3.min.js?v=20261004-hls173-1"
defer
></script>


<!--
    Entrada única del visor multimedia.

    HLS:
        visor-video-multimedia.js
            -> visor-video.js

    MP4:
        visor-video-multimedia.js
            -> reproductor HTML5

    Ambos modos comparten estructura y estilos.

    Los controles de progreso corresponden
    exclusivamente a la modalidad MP4.
-->


<script
src="../js/visor-video-multimedia.js?v=20261101-termometro1"
defer
></script>

</head>


<body>


<main
id="visor-video"
class="visor-video"
aria-label="Visor de vídeo MeteoArchidona"
>


<!-- ======================================================
     ELEMENTO DE VÍDEO
     ====================================================== -->


<video
id="visor-video-elemento"
autoplay
muted
playsinline
preload="auto"
aria-label="Emisión en directo"
>
</video>


<!-- ======================================================
     DATOS METEOROLÓGICOS
     ====================================================== -->


<div
id="visor-video-meteo"
class="visor-video-meteo visor-video-superposicion"
aria-label="Condiciones meteorológicas actuales"
>


<span class="visor-video-meteo-dato">

<span id="visor-video-temperatura">
— °C
</span>

</span>


<span class="visor-video-meteo-dato">

<span id="visor-video-humedad">
— %
</span>

</span>


<span class="visor-video-meteo-dato">

<span id="visor-video-lluvia">
— mm
</span>

</span>


</div>


<!-- ======================================================
     ESTADO DE EMISIÓN / REPRODUCCIÓN
     ====================================================== -->


<div
id="visor-video-estado"
class="visor-video-estado visor-video-superposicion"
aria-live="polite"
>
CONECTANDO
</div>


<!-- ======================================================
     MARCA METEOARCHIDONA CÁMARAS
     ====================================================== -->


<div
id="visor-video-marca"
class="visor-video-marca visor-video-superposicion"
aria-hidden="true"
>

<img
src="/assets/icono-camaras-192.png?v=20261101-nieve"
alt=""
>

</div>


<!-- ======================================================
     MENSAJE DE ERROR
     ====================================================== -->


<div
id="visor-video-error"
class="visor-video-error"
role="status"
aria-live="polite"
>


<div class="visor-video-error-contenido">


<strong>
Emisión no disponible
</strong>


<span id="visor-video-error-texto">
No se ha podido cargar el vídeo.
</span>


</div>


</div>


<!-- ======================================================
     CONTROLES PROPIOS

     Reutilizados por ambas modalidades.

     HLS:
         Conserva su comportamiento actual.

     MP4:
         Reproducción, pausa, desplazamiento
         temporal y pantalla completa.
     ====================================================== -->


<div
id="visor-video-controles"
class="visor-video-controles"
hidden
>


<!-- ======================================================
     REPRODUCIR / PAUSAR
     ====================================================== -->


<button
id="visor-video-play"
class="visor-video-control"
type="button"
aria-label="Pausar vídeo"
title="Reproducir / pausar"
>
❚❚
</button>


<!-- ======================================================
     PROGRESO MP4

     Oculto inicialmente.

     El controlador multimedia lo activará
     únicamente cuando corresponda.

     El valor de la barra representa la
     posición relativa dentro del archivo MP4.

     No representa directamente la hora
     meteorológica de los fotogramas.
     ====================================================== -->


<div
id="visor-video-progreso"
class="visor-video-progreso"
hidden
>


<label
class="visor-video-progreso-etiqueta"
for="visor-video-busqueda"
>
Posición del timelapse
</label>


<input
id="visor-video-busqueda"
class="visor-video-progreso-barra"
type="range"
min="0"
max="1000"
step="1"
value="0"
disabled
aria-label="Avanzar o retroceder por el timelapse"
>


<div
class="visor-video-progreso-tiempos"
aria-hidden="true"
>


<span
id="visor-video-tiempo-actual"
class="visor-video-tiempo-actual"
>
00:00
</span>


<span
class="visor-video-progreso-separador"
>
/
</span>


<span
id="visor-video-tiempo-total"
class="visor-video-tiempo-total"
>
--:--
</span>


</div>


</div>


<!-- ======================================================
     PANTALLA COMPLETA
     ====================================================== -->


<button
id="visor-video-fullscreen"
class="visor-video-control"
type="button"
aria-label="Pantalla completa"
title="Pantalla completa"
>
⛶
</button>


</div>


</main>


</body>

</html>

<!-- Fin de fichero: visores/video.html -->
