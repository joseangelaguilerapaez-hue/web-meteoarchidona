<!-- administracion.html -->

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Administración privada de MeteoArchidona."
    >

    <title>
        Administración · MeteoArchidona
    </title>

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <style>
        :root {
            --bg: #080d14;
            --surface: #0d1520;
            --card: #111e2e;
            --card-soft: #0d1a27;
            --border: #1a2d42;
            --accent: #f0a500;
            --gold: #d48800;
            --teal: #00c9a7;
            --blue: #3b9eff;
            --cyan: #36d5ff;
            --green: #22c55e;
            --red: #ef4444;
            --text: #f6f8fb;
            --muted: #aabdd0;
            --shadow:
                0 18px 50px
                rgba(0, 0, 0, 0.38);
        }

        * {
            box-sizing: border-box;
        }

        html {
            min-width: 320px;
        }

        body {
            min-height: 100vh;
            margin: 0;
            background:
                radial-gradient(
                    circle at top,
                    #0b1b2d 0,
                    var(--bg) 42%
                );
            color: var(--text);
            font-family:
                "Sora",
                sans-serif;
        }

        button,
        a {
            font: inherit;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .pagina {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cabecera {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            min-height: 82px;
            padding:
                12px
                clamp(16px, 4vw, 42px);
            border-bottom:
                1px solid
                var(--border);
            background:
                rgba(8, 13, 20, 0.94);
            backdrop-filter:
                blur(16px);
        }

        .marca {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .marca-icono {
            position: relative;
            width: 58px;
            height: 46px;
            flex: 0 0 auto;
        }

        .sol {
            position: absolute;
            top: 2px;
            left: 23px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background:
                linear-gradient(
                    135deg,
                    #ffd44f,
                    var(--accent)
                );
            box-shadow:
                0 0 22px
                rgba(240, 165, 0, 0.28);
        }

        .nube {
            position: absolute;
            left: 7px;
            bottom: 6px;
            width: 46px;
            height: 20px;
            border:
                2px solid
                #e5edf5;
            border-radius: 22px;
            background:
                var(--bg);
        }

        .nube::before,
        .nube::after {
            position: absolute;
            content: "";
            background:
                var(--bg);
            border:
                2px solid
                #e5edf5;
            border-bottom: 0;
            border-radius:
                50% 50% 0 0;
        }

        .nube::before {
            width: 18px;
            height: 15px;
            left: 6px;
            top: -12px;
        }

        .nube::after {
            width: 22px;
            height: 18px;
            left: 21px;
            top: -15px;
        }

        .marca-titulo {
            font-size:
                clamp(
                    18px,
                    3vw,
                    24px
                );
            font-weight: 700;
            letter-spacing:
                0.02em;
        }

        .marca-titulo span {
            color:
                var(--accent);
        }

        .marca-subtitulo {
            margin-top: 3px;
            color:
                var(--muted);
            font-size: 11px;
        }

        .volver {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 44px;
            padding:
                0 15px;
            border:
                1px solid
                var(--border);
            border-radius:
                10px;
            background:
                var(--card-soft);
            color:
                var(--muted);
            font-size: 12px;
            font-weight: 700;
            transition:
                border-color 0.18s ease,
                color 0.18s ease;
        }

        .volver:hover {
            border-color:
                var(--blue);
            color:
                var(--text);
        }

        .contenido {
            flex: 1;
            display: grid;
            place-items: center;
            width: 100%;
            padding:
                28px 16px
                42px;
        }

        .acceso {
            width:
                min(
                    430px,
                    100%
                );
            padding:
                clamp(
                    22px,
                    5vw,
                    34px
                );
            border:
                1px solid
                var(--border);
            border-radius:
                20px;
            background:
                linear-gradient(
                    145deg,
                    rgba(
                        17,
                        30,
                        46,
                        0.99
                    ),
                    rgba(
                        9,
                        22,
                        34,
                        0.99
                    )
                );
            box-shadow:
                var(--shadow);
        }

        .candado {
            display: grid;
            place-items: center;
            width: 72px;
            height: 72px;
            margin:
                0 auto
                18px;
            border:
                1px solid
                rgba(
                    240,
                    165,
                    0,
                    0.45
                );
            border-radius:
                50%;
            background:
                rgba(
                    240,
                    165,
                    0,
                    0.08
                );
            color:
                var(--accent);
            font-size: 33px;
            box-shadow:
                0 0 28px
                rgba(
                    240,
                    165,
                    0,
                    0.10
                );
        }

        h1 {
            margin:
                0 0
                8px;
            text-align: center;
            font-size:
                clamp(
                    23px,
                    5vw,
                    30px
                );
        }

        .descripcion {
            max-width: 330px;
            margin:
                0 auto
                24px;
            color:
                var(--muted);
            text-align: center;
            font-size: 13px;
            line-height: 1.6;
        }

        .indicador-pin {
            display: flex;
            justify-content: center;
            gap: 13px;
            min-height: 32px;
            margin-bottom: 24px;
        }

        .punto-pin {
            width: 18px;
            height: 18px;
            border:
                2px solid
                #38536d;
            border-radius: 50%;
            background:
                transparent;
            transition:
                background 0.14s ease,
                border-color 0.14s ease,
                box-shadow 0.14s ease,
                transform 0.14s ease;
        }

        .punto-pin.activo {
            border-color:
                var(--cyan);
            background:
                var(--cyan);
            box-shadow:
                0 0 12px
                rgba(
                    54,
                    213,
                    255,
                    0.5
                );
            transform:
                scale(1.08);
        }

        .teclado {
            display: grid;
            grid-template-columns:
                repeat(
                    3,
                    1fr
                );
            gap: 12px;
            width: 100%;
            max-width: 330px;
            margin:
                0 auto;
        }

        .tecla {
            display: grid;
            place-items: center;
            min-height: 70px;
            border:
                1px solid
                #29435e;
            border-radius:
                15px;
            background:
                linear-gradient(
                    145deg,
                    #14283c,
                    #0d1a28
                );
            color:
                var(--text);
            font-family:
                "JetBrains Mono",
                monospace;
            font-size: 25px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            touch-action:
                manipulation;
            transition:
                transform 0.08s ease,
                border-color 0.14s ease,
                background 0.14s ease,
                opacity 0.15s ease;
        }

        .tecla:hover {
            border-color:
                var(--blue);
        }

        .tecla:active {
            transform:
                scale(0.95);
            background:
                #193652;
        }

        .tecla:disabled {
            cursor: default;
            opacity: 0.38;
        }

        .tecla-accion {
            color:
                var(--muted);
            font-family:
                "Sora",
                sans-serif;
            font-size: 15px;
        }

        .tecla-borrar {
            color:
                var(--cyan);
            font-size: 22px;
        }

        .acceder {
            width: 100%;
            min-height: 54px;
            margin-top: 18px;
            border: 0;
            border-radius: 12px;
            background:
                linear-gradient(
                    135deg,
                    #0c7b67,
                    var(--teal)
                );
            color:
                #041e19;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition:
                opacity 0.15s ease,
                transform 0.08s ease;
        }

        .acceder:active {
            transform:
                scale(0.985);
        }

        .acceder:disabled {
            cursor: default;
            opacity: 0.32;
        }

        .estado {
            min-height: 22px;
            margin-top: 16px;
            color:
                var(--muted);
            text-align: center;
            font-size: 12px;
            line-height: 1.5;
        }

        .estado.info {
            color:
                var(--cyan);
        }

        .estado.ok {
            color:
                #62e69a;
        }

        .estado.error {
            color:
                #ff8e9d;
        }

        .nota-seguridad {
            margin-top: 24px;
            padding-top: 18px;
            border-top:
                1px solid
                var(--border);
            color:
                #7890a7;
            text-align: center;
            font-size: 10px;
            line-height: 1.6;
        }

        @media (
            max-width: 520px
        ) {
            .cabecera {
                min-height: 74px;
                padding:
                    10px 14px;
            }

            .marca-icono {
                width: 50px;
                transform:
                    scale(0.88);
                transform-origin:
                    left center;
            }

            .marca-subtitulo {
                display: none;
            }

            .volver {
                min-height: 40px;
                padding:
                    0 11px;
                font-size: 11px;
            }

            .contenido {
                align-items: start;
                padding-top: 22px;
            }

            .acceso {
                padding:
                    22px 18px
                    26px;
            }

            .tecla {
                min-height: 68px;
            }
        }
    </style>
</head>

<body>

    <div class="pagina">

        <header class="cabecera">

            <a
                href="index.html"
                class="marca"
                aria-label="Volver a MeteoArchidona"
            >

                <div
                    class="marca-icono"
                    aria-hidden="true"
                >
                    <div class="sol"></div>
                    <div class="nube"></div>
                </div>

                <div>

                    <div class="marca-titulo">
                        METEO<span>ARCHIDONA</span>
                    </div>

                    <div class="marca-subtitulo">
                        Administración privada
                    </div>

                </div>

            </a>

            <a
                href="index.html"
                class="volver"
            >
                ← Volver
            </a>

        </header>

        <main class="contenido">

            <section
                id="panelAcceso"
                class="acceso"
                aria-labelledby="tituloAcceso"
            >

                <div
                    class="candado"
                    aria-hidden="true"
                >
                    🔒
                </div>

                <h1 id="tituloAcceso">
                    Administración
                </h1>

                <p class="descripcion">
                    Introduce tu PIN de seis cifras
                    para acceder al área privada de
                    MeteoArchidona.
                </p>

                <div
                    id="indicadorPin"
                    class="indicador-pin"
                    aria-label="PIN introducido"
                >

                    <span class="punto-pin"></span>
                    <span class="punto-pin"></span>
                    <span class="punto-pin"></span>
                    <span class="punto-pin"></span>
                    <span class="punto-pin"></span>
                    <span class="punto-pin"></span>

                </div>

                <div
                    id="tecladoPin"
                    class="teclado"
                    aria-label="Teclado numérico"
                >

                    <button
                        type="button"
                        class="tecla"
                        data-numero="1"
                    >1</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="2"
                    >2</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="3"
                    >3</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="4"
                    >4</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="5"
                    >5</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="6"
                    >6</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="7"
                    >7</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="8"
                    >8</button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="9"
                    >9</button>

                    <button
                        id="botonLimpiar"
                        type="button"
                        class="tecla tecla-accion"
                        aria-label="Borrar todo el PIN"
                    >
                        Limpiar
                    </button>

                    <button
                        type="button"
                        class="tecla"
                        data-numero="0"
                    >0</button>

                    <button
                        id="botonBorrar"
                        type="button"
                        class="tecla tecla-borrar"
                        aria-label="Borrar última cifra"
                    >
                        ⌫
                    </button>

                </div>

                <button
                    id="botonAcceder"
                    class="acceder"
                    type="button"
                    disabled
                >
                    Acceder
                </button>

                <div
                    id="estadoAcceso"
                    class="estado"
                    role="status"
                    aria-live="polite"
                ></div>

                <div class="nota-seguridad">
                    El PIN no se almacena en esta página.
                    Se envía exclusivamente a la API de
                    MeteoArchidona para obtener una
                    autorización administrativa temporal.
                </div>

            </section>

        </main>

    </div>

    <script>
        const LONGITUD_PIN = 6;

        const URL_API =
            "https://api-meteoarchidona.onrender.com";

        const URL_ACCESO =
            URL_API
            + "/admin/acceso";

        const CLAVE_TOKEN =
            "meteoarchidona_admin_token";

        const CLAVE_TIPO_TOKEN =
            "meteoarchidona_admin_tipo_token";

        const CLAVE_EXPIRACION =
            "meteoarchidona_admin_expira_en";

        const CLAVE_DURACION =
            "meteoarchidona_admin_duracion_segundos";

        let pinIntroducido = "";

        let solicitudEnCurso = false;

        const indicadorPin =
            document.getElementById(
                "indicadorPin"
            );

        const puntosPin = Array.from(
            indicadorPin.querySelectorAll(
                ".punto-pin"
            )
        );

        const botonAcceder =
            document.getElementById(
                "botonAcceder"
            );

        const botonBorrar =
            document.getElementById(
                "botonBorrar"
            );

        const botonLimpiar =
            document.getElementById(
                "botonLimpiar"
            );

        const estadoAcceso =
            document.getElementById(
                "estadoAcceso"
            );

        const teclasNumero =
            document.querySelectorAll(
                "[data-numero]"
            );

        const teclas =
            document.querySelectorAll(
                ".tecla"
            );


        function actualizarIndicadorPin() {

            puntosPin.forEach(
                (
                    punto,
                    indice
                ) => {
                    punto.classList.toggle(
                        "activo",
                        indice
                            < pinIntroducido.length
                    );
                }
            );

            botonAcceder.disabled =
                solicitudEnCurso
                || (
                    pinIntroducido.length
                    !== LONGITUD_PIN
                );
        }


        function establecerTecladoBloqueado(
            bloqueado
        ) {

            teclas.forEach(
                tecla => {
                    tecla.disabled =
                        bloqueado;
                }
            );
        }


        function limpiarEstado() {

            estadoAcceso.className =
                "estado";

            estadoAcceso.textContent =
                "";
        }


        function mostrarEstado(
            mensaje,
            tipo = ""
        ) {

            estadoAcceso.className =
                tipo
                    ? "estado " + tipo
                    : "estado";

            estadoAcceso.textContent =
                mensaje;
        }


        function agregarNumero(
            numero
        ) {

            if (
                solicitudEnCurso
                || pinIntroducido.length
                    >= LONGITUD_PIN
            ) {
                return;
            }

            limpiarEstado();

            pinIntroducido +=
                numero;

            actualizarIndicadorPin();
        }


        function borrarUltimaCifra() {

            if (
                solicitudEnCurso
                || !pinIntroducido
            ) {
                return;
            }

            limpiarEstado();

            pinIntroducido =
                pinIntroducido.slice(
                    0,
                    -1
                );

            actualizarIndicadorPin();
        }


        function limpiarPin() {

            if (solicitudEnCurso) {
                return;
            }

            pinIntroducido = "";

            limpiarEstado();

            actualizarIndicadorPin();
        }


        function eliminarSesionAdministrativa() {

            sessionStorage.removeItem(
                CLAVE_TOKEN
            );

            sessionStorage.removeItem(
                CLAVE_TIPO_TOKEN
            );

            sessionStorage.removeItem(
                CLAVE_EXPIRACION
            );

            sessionStorage.removeItem(
                CLAVE_DURACION
            );
        }


        function guardarSesionAdministrativa(
            datos
        ) {

            sessionStorage.setItem(
                CLAVE_TOKEN,
                datos.token
            );

            if (
                datos.tipo_token
                !== null
                && datos.tipo_token
                !== undefined
            ) {
                sessionStorage.setItem(
                    CLAVE_TIPO_TOKEN,
                    String(
                        datos.tipo_token
                    )
                );
            }

            if (
                datos.expira_en
                !== null
                && datos.expira_en
                !== undefined
            ) {
                sessionStorage.setItem(
                    CLAVE_EXPIRACION,
                    String(
                        datos.expira_en
                    )
                );
            }

            if (
                datos.duracion_segundos
                !== null
                && datos.duracion_segundos
                !== undefined
            ) {
                sessionStorage.setItem(
                    CLAVE_DURACION,
                    String(
                        datos.duracion_segundos
                    )
                );
            }
        }


        function obtenerMensajeError(
            datos,
            codigoHttp
        ) {

            if (
                datos
                && typeof datos.detail
                    === "string"
                && datos.detail.trim()
            ) {
                return datos.detail;
            }

            if (codigoHttp === 401) {
                return "PIN incorrecto.";
            }

            if (codigoHttp === 429) {
                return (
                    "Demasiados intentos. "
                    + "Espera antes de volver a intentarlo."
                );
            }

            if (codigoHttp === 503) {
                return (
                    "El acceso administrativo "
                    + "no está disponible temporalmente."
                );
            }

            return (
                "No ha sido posible validar "
                + "el acceso administrativo."
            );
        }


        async function solicitarAcceso() {

            if (
                solicitudEnCurso
                || pinIntroducido.length
                    !== LONGITUD_PIN
            ) {
                return;
            }

            const pinSolicitud =
                pinIntroducido;

            solicitudEnCurso =
                true;

            eliminarSesionAdministrativa();

            establecerTecladoBloqueado(
                true
            );

            actualizarIndicadorPin();

            botonAcceder.textContent =
                "Validando...";

            mostrarEstado(
                "Comprobando acceso con la API...",
                "info"
            );

            try {

                const respuesta =
                    await fetch(
                        URL_ACCESO,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body: JSON.stringify(
                                {
                                    pin:
                                        pinSolicitud
                                }
                            ),
                            cache: "no-store"
                        }
                    );

                let datos = null;

                try {
                    datos =
                        await respuesta.json();
                } catch {
                    datos = null;
                }

                if (!respuesta.ok) {

                    throw {
                        esRespuestaHttp:
                            true,
                        codigoHttp:
                            respuesta.status,
                        datos:
                            datos
                    };
                }

                if (
                    !datos
                    || typeof datos.token
                        !== "string"
                    || !datos.token.trim()
                ) {
                    throw new Error(
                        "La API no ha devuelto "
                        + "un token administrativo válido."
                    );
                }

                guardarSesionAdministrativa(
                    datos
                );

                pinIntroducido =
                    "";

                actualizarIndicadorPin();

                mostrarEstado(
                    "Acceso autorizado. "
                    + "Sesión administrativa temporal iniciada.",
                    "ok"
                );

                botonAcceder.textContent =
                    "Acceso autorizado";

                botonAcceder.disabled =
                    true;

                establecerTecladoBloqueado(
                    true
                );

            } catch (error) {

                eliminarSesionAdministrativa();

                pinIntroducido =
                    "";

                if (
                    error
                    && error.esRespuestaHttp
                ) {

                    mostrarEstado(
                        obtenerMensajeError(
                            error.datos,
                            error.codigoHttp
                        ),
                        "error"
                    );

                } else {

                    mostrarEstado(
                        "No ha sido posible comunicarse "
                        + "con la API de MeteoArchidona.",
                        "error"
                    );
                }

                solicitudEnCurso =
                    false;

                establecerTecladoBloqueado(
                    false
                );

                botonAcceder.textContent =
                    "Acceder";

                actualizarIndicadorPin();

                return;
            }

            solicitudEnCurso =
                false;
        }


        teclasNumero.forEach(
            tecla => {
                tecla.addEventListener(
                    "click",
                    () => {
                        agregarNumero(
                            tecla.dataset.numero
                        );
                    }
                );
            }
        );


        botonBorrar.addEventListener(
            "click",
            borrarUltimaCifra
        );


        botonLimpiar.addEventListener(
            "click",
            limpiarPin
        );


        botonAcceder.addEventListener(
            "click",
            solicitarAcceso
        );


        document.addEventListener(
            "keydown",
            evento => {

                if (solicitudEnCurso) {
                    return;
                }

                if (
                    /^[0-9]$/.test(
                        evento.key
                    )
                ) {
                    agregarNumero(
                        evento.key
                    );

                    return;
                }

                if (
                    evento.key
                    === "Backspace"
                ) {
                    borrarUltimaCifra();

                    return;
                }

                if (
                    evento.key
                    === "Escape"
                ) {
                    limpiarPin();

                    return;
                }

                if (
                    evento.key
                    === "Enter"
                    && !botonAcceder.disabled
                ) {
                    solicitarAcceso();
                }
            }
        );


        actualizarIndicadorPin();
    </script>

</body>

</html>
