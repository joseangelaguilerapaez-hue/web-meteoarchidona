<div class="pagina">

<!-- =========================================================
     MI WEB
     Una pestaña propia del registrado (/mi-web?pestana=1, 2 o 3): su
     descripción de título, el selector de dashboards de su formato con
     «Fijar», y crear, copiar, editar y borrar los suyos con el editor
     común. Diseño: docs/dashboards.md de api-meteoarchidona (José, 5 y
     17-11-2026). Lo pinta js/mi-web/pagina.js.
     ========================================================= -->

<main class="mi-web">

<header class="mi-web-cabecera">

    <div
        id="etiquetaMiWeb"
        class="mi-web-etiqueta"
    >
        METEOARCHIDONA · MI WEB
    </div>

    <h1 id="tituloMiWeb">
        Mi web
    </h1>

</header>

<div
    id="estadoMiWeb"
    class="mi-web-estado"
    role="status"
    aria-live="polite"
>
    Cargando…
</div>

<section
    id="miWebSinSesion"
    class="mi-web-bloque"
    hidden
>
    <p>
        Las pestañas de «Mi web» son de cada registrado: inicia sesión para
        ver las tuyas.
    </p>
    <div class="mi-web-acciones">
        <button type="button" class="mi-web-boton mi-web-boton-principal" data-cuenta-accion="entrar">
            Iniciar sesión
        </button>
        <button type="button" class="mi-web-boton" data-cuenta-accion="registrar">
            Registrarse
        </button>
    </div>
</section>

<div
    id="miWebContenido"
    hidden
></div>

</main>

</div>


<div id="pie"></div>
