<div class="pagina">


<div id="cabecera"></div>


<!--
    Predicción de Archidona, por pestañas. js/prediccion.js monta los
    componentes de cada pestaña. MeteoArchidona no predice: cada pestaña
    dice de dónde viene lo que enseña y nunca se inventan datos.
-->
<main class="prediccion">


<header class="pred-encabezado">

    <div class="pred-etiqueta">
        METEOARCHIDONA · PREDICCIÓN
    </div>

    <h1>
        El tiempo en Archidona
    </h1>

</header>


<!--
    Pestañas por fuente (decisión de José, 2-11-2026). Cada pestaña es un
    componente que también se puede poner en otras páginas o dashboards:

    - AEMET: una pieza por componente en js/prediccion/ (avisos, ahora,
      presentador, hoy, horas y días; 4-11-2026).
    - Modelos numéricos: js/modelos-numericos.js (predicciones por
      conjuntos de Open-Meteo, docs/predicciones-conjuntos.md de la API).

    Para añadir otra (otra agencia, mapas isobáricos…): un botón con
    data-pestana, su panel y su componente en js/prediccion.js.
    La pestaña abierta queda en la dirección (/prediccion#modelos).
-->
<nav
    class="pred-pestanas"
    role="tablist"
    aria-label="Fuentes de la predicción"
>

    <button
        type="button"
        class="pred-pestana"
        role="tab"
        id="pestana-aemet"
        data-pestana="aemet"
        aria-controls="panel-aemet"
        aria-selected="true"
    >AEMET</button>

    <button
        type="button"
        class="pred-pestana"
        role="tab"
        id="pestana-modelos"
        data-pestana="modelos"
        aria-controls="panel-modelos"
        aria-selected="false"
        tabindex="-1"
    >Modelos numéricos</button>

</nav>


<div
    class="pred-panel"
    role="tabpanel"
    id="panel-aemet"
    aria-labelledby="pestana-aemet"
>
    <!--
        Cada pieza es un componente (js/prediccion/*.js, 4-11-2026), como
        en Sol: se puede poner suelta en otras páginas o dashboards.
    -->
    <div class="pred-componente">

        <div data-componente="prediccion-avisos"></div>

        <div data-componente="prediccion-ahora"></div>

        <div data-componente="prediccion-presentador"></div>

        <div data-componente="prediccion-hoy"></div>

        <div data-componente="prediccion-horas"></div>

        <div data-componente="prediccion-dias"></div>

        <section
            class="pred-tarjeta pred-otras"
            aria-labelledby="pred-otras-titulo"
        >

            <h2
                class="pred-titulo"
                id="pred-otras-titulo"
            >
                Otras predicciones
            </h2>

            <ul class="pred-enlaces">

                <li>
                    <a
                        href="https://www.aemet.es/es/eltiempo/prediccion/municipios"
                        target="_blank"
                        rel="noopener"
                    >AEMET · predicción por municipios</a>
                </li>

                <li>
                    <a
                        href="https://www.aemet.es/es/eltiempo/prediccion/avisos"
                        target="_blank"
                        rel="noopener"
                    >AEMET · avisos</a>
                </li>

                <li>
                    <a
                        href="https://www.eltiempo.es/"
                        target="_blank"
                        rel="noopener"
                    >eltiempo.es</a>
                </li>

            </ul>

        </section>

    </div>
</div>


<div
    class="pred-panel"
    role="tabpanel"
    id="panel-modelos"
    aria-labelledby="pestana-modelos"
    hidden
>
    <div data-componente="modelos-numericos"></div>
</div>


</main>


</div>



<div id="pie"></div>
