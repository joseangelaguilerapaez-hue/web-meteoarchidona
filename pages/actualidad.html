<body data-seccion="actualidad">


<div id="cabecera"></div>
<!-- Semáforos de alertas (docs/alertas-meteorologicas.md de la API): fijos
     bajo la cabecera, solo si hay algún aviso; js/alertas/semaforos.js. -->
<div
    data-componente="alertas-semaforos"
    data-fijo="si"
    hidden
></div>


<div
    class="capa-lluvia"
    id="capa-lluvia"
    aria-hidden="true"
></div>


<div
    class="capa-gotas-cristal"
    id="capa-gotas-cristal"
    aria-hidden="true"
></div>


<main
    class="contenido"
    id="actual"
>


<h1 class="solo-lectores">
    MeteoArchidona · El tiempo en Archidona y su comarca
</h1>


<section
    class="panel-superior"
    id="estaciones"
>


<!--
    Columna izquierda: dos tarjetas apiladas. Van dentro de un <div>
    para ocupar una sola casilla de la rejilla del panel.
-->
<div class="columna-resumen">


<div data-componente="condiciones-actuales"></div>


<div data-componente="sol-luna"></div>


</div>


<!--
    Las fichas de estación se cargan dinámicamente desde:

        /componentes/ficha-estacion.html

    y se instancian según el catálogo público de estaciones.
-->


</section>


<!-- ======================================================
     TIMELAPSES PÚBLICOS
     ======================================================

     Este componente está separado de las fichas de estación.

     El módulo público de timelapses será responsable de:

     - consultar los vídeos publicados;
     - seleccionar el día anterior;
     - priorizar COMPLETO frente a PARCIAL;
     - generar dinámicamente los visores;
     - mostrar la sección cuando exista contenido.

     Hasta completar esa integración permanece oculto.

     Los MP4 no se cargarán automáticamente al entrar
     en Actualidad.
     ====================================================== -->


<section
    id="timelapses"
    class="tarjeta timelapses-seccion"
    data-auditoria-visualizacion="TIMELAPSES"
    aria-labelledby="timelapses-titulo"
    hidden
>


<div class="timelapses-cabecera">

    <h2
        id="timelapses-titulo"
        class="seccion-titulo"
    >
        Timelapse del día anterior
    </h2>

    <p class="timelapses-descripcion">
        La evolución meteorológica vista desde nuestras cámaras.
    </p>

</div>


<div
    id="timelapses-lista"
    class="timelapses-lista"
    aria-live="polite"
></div>


</section>


<!-- ======================================================
     GRÁFICAS DEL CATÁLOGO DE ESTADÍSTICAS

     Dos estadísticas del catálogo propio, por su código. Las monta
     js/estadisticas-incrustadas.js con el visor común (gráfica, tabla
     y PDF); la sección nace oculta y solo aparece si llega alguna.
     Las elige José (29-10-2026). Cuando Actualidad sea un dashboard,
     esto pasará a ser su configuración.
     ====================================================== -->


<section
    class="tarjeta graficas-actualidad"
    id="graficas-actualidad"
    aria-labelledby="graficas-actualidad-titulo"
    hidden
>


<div class="graficas-actualidad-cabecera">

    <h2
        class="seccion-titulo"
        id="graficas-actualidad-titulo"
    >
        El Silo frente a Los Llanos
    </h2>

    <a
        class="graficas-actualidad-enlace"
        href="/estadisticas"
    >
        Más estadísticas
    </a>

</div>


<div class="graficas-actualidad-lista">

    <div
        class="graficas-actualidad-visor"
        data-estadistica="SILO_LLANOS_TEMPERATURA_7D"
    ></div>

    <div
        class="graficas-actualidad-visor"
        data-estadistica="SILO_LLANOS_MAXIMAS_MINIMAS_30D"
        data-presentacion="GRAFICA"
    ></div>

</div>


</section>


<!-- ======================================================
     ADELANTO DE LA PREDICCIÓN

     Tres días en corto. Los rellena
     js/actualidad/prediccion-breve.js con GET /prediccion/archidona;
     la sección nace oculta y solo aparece si la predicción llega.
     ====================================================== -->


<div data-componente="prediccion-breve"></div>


<!-- ======================================================
     ACCESOS A OTRAS SECCIONES
     ====================================================== -->


<div data-componente="accesos"></div>


</main>
