<!--
    MeteoArchidona · Cabecera común

    Único sitio donde se define la navegación del sitio. La inserta
    js/cabecera.js en el <div id="cabecera"> de cada página, y se
    estiliza con css/cabecera.css.

    Para añadir una sección: un <a> más aquí, con su data-seccion, y
    en la página nueva <body data-seccion="loquesea"> para que el
    enlace salga marcado.

    Las direcciones van sin .html y desde la raíz: las páginas viven
    en pages/ pero se sirven como /en-vivo, /observaciones... Ver el
    .htaccess.
-->

<header class="cabecera">

<a
    href="/"
    class="marca"
    aria-label="Ir a Actualidad"
>

    <div
        class="marca-icono"
        aria-hidden="true"
    >

        <div class="sol"></div>

        <div class="nube"></div>

    </div>


    <div>

        <div class="marca-titulo">

            METEO<span>ARCHIDONA</span>

        </div>

        <div class="marca-subtitulo">

            El tiempo de nuestra comarca

        </div>

    </div>

</a>


<!--
    Botón del menú desplegable. Solo se ve en pantallas de hasta
    850 px (ver css/cabecera.css); en escritorio el menú está siempre
    a la vista. Lo abre y lo cierra js/cabecera.js.
-->
<button
    type="button"
    class="boton-menu"
    aria-controls="navegacion-principal"
    aria-expanded="false"
    aria-label="Abrir menú"
>
    <span class="boton-menu-raya"></span>
    <span class="boton-menu-raya"></span>
    <span class="boton-menu-raya"></span>
</button>


<nav
    class="navegacion"
    id="navegacion-principal"
    aria-label="Navegación principal"
>

<a
    href="/"
    data-seccion="actualidad"
>
    Actualidad
</a>


<a
    href="/observaciones"
    data-seccion="observaciones"
>
    Observaciones
</a>


<a
    href="/prediccion"
    data-seccion="prediccion"
>
    Predicción
</a>


<a
    href="/en-vivo"
    data-seccion="en-vivo"
>
    En vivo
</a>


<a
    href="/administracion"
    data-seccion="administracion"
>
    Administración
</a>

</nav>


<div class="zona-derecha">


<!--
    Hueco para los controles propios de una página. Administración
    mete aquí su botón de cerrar sesión: lo declara en su HTML con
    data-en-cabecera y js/cabecera.js lo trae al montar.

    Va así y no dentro de este fichero porque el botón tiene que
    existir desde el primer momento: js/administracion.js lo busca
    por su id nada más arrancar, y la cabecera llega después.
-->
<div
    class="cabecera-acciones"
    id="cabecera-acciones"
></div>


<div class="hora">

    <div>

        <div
            class="fecha"
            id="fecha-actual"
        >
            --
        </div>

        <div
            class="reloj"
            id="reloj-actual"
        >
            --:--
        </div>

    </div>

</div>


<!--
    El logotipo de Y&Z es el mando de la lluvia de prueba: dos toques
    seguidos suben de nivel y una pulsación larga la apagan. Lo lleva
    configurarControlLluvia() de js/actualidad.js, que lo reconoce por
    data-lluvia-control.

    Es un botón y no un enlace a propósito: siendo enlace, el primer
    toque navegaría y nunca llegaría el segundo. Para volver a la
    portada está el nombre del sitio, a la izquierda.
-->
<button
    type="button"
    class="firma-proyecto"
    id="firma-proyecto"
    data-lluvia-control="GLOBAL"
    aria-label="Y&Z Project · lluvia de prueba"
    title="Y&Z Project"
>

    <img
        src="/assets/yz-project.jpg"
        alt="Y&Z Project"
        draggable="false"
    >

    <span
        class="simulacion-global"
        id="simulacion-GLOBAL"
    ></span>

</button>


</div>


</header>

<!-- Fin de fichero: componentes/cabecera.html -->
