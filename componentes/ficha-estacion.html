<!--
    MeteoArchidona · Ficha de estación

    Componente reutilizable de una estación meteorológica.

    La ficha no representa una estación concreta. Los identificadores
    terminados en PLANTILLA se sustituyen dinámicamente por el código
    real de la estación al crear cada instancia.

    Modos soportados:

        ficha-estacion--vertical
        ficha-estacion--horizontal

    La página o dashboard que utiliza el componente decide el modo.

    El visor de cámara forma siempre parte de la ficha. Si la estación
    dispone de cámara mostrará su emisión; si todavía no dispone de ella,
    el propio visor mostrará el estado de vídeo no disponible.

    Este componente se utiliza inicialmente desde Actualidad y queda
    preparado para reutilizarse posteriormente en dashboards
    configurables por los usuarios.
-->
